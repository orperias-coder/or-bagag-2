<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f2fa">
<meta name="robots" content="noindex">
<title>לוח העסק · אור בגג</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Heebo:wght@400;500;600&display=swap">
<style>
/* לוח העסק, סגנון "בית נעים" (אור בחר 07.11: "הסגנון החדש הרבה יותר טוב", מוקאפ 3MFmwoVGHSXU6qwVU2yBxT).
   לבנדר-שמנת רך, פינות עגולות, כרטיסים תפוחים. מחשב: תפריט-צד + פס-ברכה + 4 כרטיסי-מספר + חלונות. טלפון: טור אחד + סרגל צף.
   בהיר בלבד בכוונה (הוראת אור: צבעים בהירים גם כשהמחשב במצב כהה). */
:root{
  --bg:#f5f2fa; --bg2:#fbf7f1; --surface:#fff; --tray:#f8f6fc; --ink:#2b2540; --muted:#857d98; --line:#ece7f5; --line2:#ddd5ec;
  --lav:#7b68d9; --lav-deep:#5b49b8; --lav-soft:#ece8fb; --lav-mid:#d9d1f6;
  --wa:#2a9a63; --wa-deep:#1d7148; --accent:#e07a3a; --accent-soft:#fdeee3; --late:#d0662a;
  --or:#e07a3a; --ron:#2f8f98; --zo:#b0587d;
  --spring:cubic-bezier(.34,1.5,.5,1); --soft:cubic-bezier(.22,1,.36,1);
  --r:24px; --puff:0 1px 2px rgba(60,40,110,.05),0 14px 34px -16px rgba(70,50,140,.22);
  --f:"Rubik","Heebo",system-ui,sans-serif;
  color-scheme:light;
}
html{background:var(--bg)}
body{margin:0;background:linear-gradient(160deg,var(--bg) 0%,var(--bg2) 70%) fixed;color:var(--ink);font-family:var(--f);font-size:15.5px;line-height:1.55;direction:rtl;text-align:right;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
.shell{max-width:1500px;margin:0 auto;display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;
  padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{display:flex;flex-direction:column;gap:20px;min-width:0}

/* ---------- שכבת תנועה ---------- */
.lift{--rx:0deg;--ry:0deg;--ty:0px;--sc:1;transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry)) translateY(var(--ty)) scale(var(--sc));
  transition:transform .55s var(--spring),box-shadow .35s var(--soft),border-color .3s,background-color .3s,opacity .3s;position:relative}
@media (hover:hover){.lift:hover{--ty:-3px;box-shadow:0 16px 30px -14px rgba(70,50,140,.3);border-color:var(--line2)}}
.lift:active{--sc:.975;transition-duration:.15s}
.boot .lift,.boot .panel,.boot .tile,.boot .hero{animation:rise .7s var(--spring) backwards;animation-delay:calc(var(--i,0)*45ms + 80ms)}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}}
.btn{position:relative;overflow:hidden;font-size:.88rem;font-weight:500;cursor:pointer;min-height:40px;padding:6px 15px;border-radius:12px;border:1px solid var(--line2);background:#fff;
  transition:transform .45s var(--spring),box-shadow .3s,background .2s;white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:inherit}
@media (hover:hover){.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px -8px rgba(70,50,140,.35)}}
.btn:active{transform:scale(.94);transition-duration:.12s}
.btn:disabled{opacity:.5;cursor:default}
.btn.go{background:var(--wa);border-color:var(--wa);color:#fff}
.btn.dark{background:var(--lav);border-color:var(--lav);color:#fff}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);pointer-events:none;animation:rp .6s var(--soft) forwards}
@keyframes rp{to{transform:scale(1);opacity:0}}
.n{display:inline-block;transition:transform .5s var(--spring)}
.n.bump{transform:scale(1.45)}
.pulse{animation:breathe 3.2s ease-in-out infinite}
@keyframes breathe{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c,var(--wa)) 40%,transparent)}50%{box-shadow:0 0 0 6px transparent}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
:focus-visible{outline:2px solid var(--lav);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- תפריט צד ---------- */
.side{position:sticky;top:calc(18px + env(safe-area-inset-top,0px));align-self:start;background:linear-gradient(180deg,#fff 0%,var(--lav-soft) 100%);border-radius:28px;padding:22px 16px 18px;
  display:flex;flex-direction:column;gap:16px;box-shadow:var(--puff);min-height:calc(100vh - 36px);box-sizing:border-box}
.logo{height:44px;width:auto;display:block;align-self:center}
.me{display:flex;flex-direction:column;align-items:center;gap:8px;padding:6px 0 4px}
.avatar{position:relative;width:76px;height:76px;border-radius:50%;display:grid;place-items:center;font-size:1.7rem;font-weight:600;color:#fff;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--w) 55%,#fff),var(--w) 70%);
  box-shadow:0 0 0 5px #fff,0 0 0 7px color-mix(in srgb,var(--w) 35%,#fff),0 14px 26px -10px color-mix(in srgb,var(--w) 70%,transparent)}
.avatar::after{content:"";position:absolute;bottom:3px;left:3px;width:15px;height:15px;border-radius:50%;background:var(--wa);border:3px solid #fff}
.me b{font-size:1.1rem;font-weight:600}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:none;cursor:pointer;padding:10px 12px;border-radius:14px;font-size:.95rem;color:#5b5378;text-align:right;
  transition:background .3s,color .3s,transform .45s var(--spring)}
.nav button svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.nav button span{flex:1}
.nav button i{font-style:normal;font-size:.75rem;font-weight:600;min-width:22px;height:22px;border-radius:99px;display:grid;place-items:center;background:#fff;color:var(--lav-deep);box-shadow:0 1px 3px rgba(70,50,140,.15)}
@media (hover:hover){.nav button:hover{background:rgba(255,255,255,.7);transform:translateX(-3px)}}
.nav button[aria-current=true]{background:#fff;color:var(--ink);font-weight:500;box-shadow:0 6px 16px -8px rgba(70,50,140,.3)}
.nav button[aria-current=true] svg{stroke:var(--lav)}
.side .foot{margin-top:auto;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.side .foot .status{text-align:center;font-size:.76rem;color:var(--muted)}

/* ---------- טלפון: כותרת וסרגל צף ---------- */
.mtop{display:none;align-items:center;gap:12px}
.dock{display:none}

/* ---------- פס ברכה ---------- */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:26px 30px;display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:center;
  background:radial-gradient(120% 140% at 0% 0%,#fff6ee 0%,transparent 55%),linear-gradient(120deg,#e9e3fb 0%,#f3eefc 55%,#fbefe6 100%);box-shadow:var(--puff)}
.hero .date{color:var(--lav-deep);font-size:.88rem;font-weight:500}
.hero h1{margin:4px 0 6px;font-size:1.9rem;font-weight:600;letter-spacing:-.01em;line-height:1.2;text-wrap:balance}
.hero p{margin:0 0 16px;color:#5b5378;font-size:1.02rem;max-width:52ch}
.hero p b{color:var(--ink);font-weight:600}
.hero .ctas{display:flex;gap:10px;flex-wrap:wrap}
.cta{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;background:var(--lav);color:#fff;font-weight:500;font-size:.98rem;padding:12px 22px;border-radius:16px;
  box-shadow:0 12px 24px -10px var(--lav),inset 0 1px 0 rgba(255,255,255,.25);transition:transform .45s var(--spring),box-shadow .3s;position:relative;overflow:hidden}
.cta.soft{background:#fff;color:var(--lav-deep);box-shadow:0 8px 18px -12px rgba(70,50,140,.5)}
.cta svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
@media (hover:hover){.cta:hover{transform:translateY(-2px)}}
.cta:active{transform:scale(.95)}
.art{position:relative;height:190px}
.art svg{width:100%;height:100%;display:block}
.art .bob{animation:float 5s ease-in-out infinite}
.art .bob2{animation:float 6.5s ease-in-out infinite .8s}
.ping{position:absolute;top:8px;right:4px;display:flex;align-items:center;gap:7px;background:#fff;border-radius:99px;padding:5px 12px 5px 6px;font-size:.78rem;font-weight:500;
  box-shadow:0 8px 18px -8px rgba(70,50,140,.35);animation:float 4.5s ease-in-out infinite;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.ping i{width:20px;height:20px;border-radius:50%;background:var(--wa);display:grid;place-items:center;flex:none}
.ping i svg{width:11px;height:11px;fill:#fff}

/* ---------- כרטיסי מספר ---------- */
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tile{--tc:#7b68d9;border:0;cursor:pointer;text-align:right;border-radius:22px;padding:16px 18px 14px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto auto;gap:4px 12px;
  background:linear-gradient(160deg,color-mix(in srgb,var(--tc) 13%,#fff) 0%,color-mix(in srgb,var(--tc) 5%,#fff) 100%);box-shadow:var(--puff);min-width:0}
.tile .ti{grid-row:1;width:42px;height:42px;border-radius:14px;display:grid;place-items:center;
  background:linear-gradient(150deg,color-mix(in srgb,var(--tc) 70%,#fff),var(--tc));box-shadow:0 8px 16px -8px var(--tc),inset 0 1px 0 rgba(255,255,255,.35)}
.tile .ti svg{width:20px;height:20px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tile .sp{grid-row:1;width:100%;max-width:120px;height:38px;justify-self:end;align-self:center;overflow:visible}
.tile .sp path.l{fill:none;stroke:var(--tc);stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.tile .sp path.a{fill:color-mix(in srgb,var(--tc) 16%,transparent);stroke:none}
.tile .sp circle{fill:#fff;stroke:var(--tc);stroke-width:2}
.tile .lb{grid-column:1/-1;font-size:.85rem;color:#5b5378;margin-top:6px}
.tile .v{grid-column:1/-1;font-size:1.75rem;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tile .dl{grid-column:1/-1;font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.tile .dl b{color:var(--wa-deep);font-weight:600}
.tile .dl b.warn{color:var(--late)}

/* ---------- רשת וחלונות ---------- */
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:20px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:var(--puff);min-width:0;transition:opacity .35s,transform .5s var(--spring)}
.span12{grid-column:span 12}.span7{grid-column:span 7}.span5{grid-column:span 5}.span6{grid-column:span 6}
.ph{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ph h2{margin:0;font-size:1.15rem;font-weight:600}
.ph .sum{color:var(--muted);font-size:.9rem;flex:1 1 220px;min-width:0}
.ph .sum b{color:var(--ink);font-weight:600}
.ph .tool{margin-inline-start:auto}
.empty{color:var(--muted);font-size:.88rem;text-align:center;padding:14px;border-radius:14px;border:1.5px dashed var(--line2)}
.chat{display:flex;flex-direction:column;gap:5px;border-radius:14px;padding:9px;background:#efeaf6}
.b{max-width:88%;padding:5px 11px;border-radius:12px;font-size:.86rem;background:#fff;align-self:flex-start}
.b.me{background:#daf5cb;align-self:flex-end}
.meta{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted);flex-wrap:wrap}

/* ---------- משימות ---------- */
.seg{position:relative;display:inline-flex;background:#efebf7;border-radius:13px;padding:3px}
.seg button{position:relative;z-index:1;border:0;background:none;cursor:pointer;padding:5px 15px;border-radius:10px;font-size:.86rem;font-weight:500;color:var(--muted);transition:color .3s}
.seg button[aria-pressed=true]{color:var(--ink)}
.seg .pill{position:absolute;top:3px;bottom:3px;border-radius:10px;background:#fff;box-shadow:0 2px 5px rgba(70,50,140,.16),inset 0 -2px 0 var(--pc,transparent);transition:right .5s var(--spring),width .5s var(--spring)}
.tasks{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;padding:11px 13px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:default}
.chk{width:24px;height:24px;border-radius:50%;border:1.8px solid #cbc2de;background:#fff;flex:none;cursor:pointer;display:grid;place-items:center;transition:background .25s,border-color .25s,transform .45s var(--spring);padding:0}
.chk svg{width:12px;height:12px;stroke:#fff;stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .35s .05s var(--soft)}
.chk:active{transform:scale(.85)}
.task.done .chk{background:var(--wa);border-color:var(--wa);transform:scale(1.08)}
.task.done .chk svg{stroke-dashoffset:0}
.task .tt{flex:1;min-width:0;position:relative}
.task .tx{background:linear-gradient(currentColor,currentColor) no-repeat right 58%/0 1.5px;transition:background-size .45s var(--soft),color .3s;overflow-wrap:anywhere}
.task.done .tt{color:var(--muted)}
.task.done .tx{background-size:100% 1.5px}
.task small{display:block;color:var(--muted);font-size:.78rem}
.task.group{background:var(--tray);cursor:pointer;text-decoration:none;color:inherit}
.task.group .cnt{font-weight:600;font-variant-numeric:tabular-nums;color:var(--pc);min-width:22px;text-align:center}
.add{display:flex;gap:8px}
.add input{flex:1;min-width:0;font-size:16px;border:1px solid var(--line2);border-radius:14px;padding:9px 14px;background:#fcfbfe}

/* ---------- יומן ---------- */
.cal{display:flex;flex-direction:column;position:relative}
.ev{display:grid;grid-template-columns:52px 5px 1fr;gap:0 12px;align-items:stretch;padding:9px 6px;border-radius:14px;border:1px solid transparent;cursor:pointer}
.ev .t{font-variant-numeric:tabular-nums;font-weight:600;font-size:.9rem;padding-top:1px}
.ev .stripe{border-radius:5px;background:var(--w)}
.ev .what{min-width:0}
.ev .what small{display:block;color:var(--muted);font-size:.8rem}
.ev.past{opacity:.5}
.now{display:flex;align-items:center;gap:8px;color:var(--accent);font-size:.75rem;font-weight:600;padding:2px 6px}
.now::after{content:"";flex:1;height:2px;background:var(--accent);border-radius:2px}
.now i{width:9px;height:9px;border-radius:50%;background:var(--accent);--c:var(--accent)}

.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translate(-50%,calc(100% + 160px));background:var(--ink);color:#fff;border-radius:16px;padding:10px 12px 10px 18px;display:flex;gap:14px;align-items:center;transition:transform .55s var(--spring);z-index:40;max-width:calc(100% - 32px);font-size:.92rem;box-shadow:0 12px 30px -10px rgba(0,0,0,.35)}
.toast.show{transform:translate(-50%,0)}
.toast button{font-weight:600;color:#cfc4ff;background:none;border:0;cursor:pointer;padding:4px 8px}

/* ---------- צבע לכל חלון ---------- */
#p-today{--pc:#7b68d9}
#p-inbox{--pc:#2a9a63}
#p-cust{--pc:#2f8f98}
#p-calls{--pc:#b0587d}
#p-tasks{--pc:#4a78d0}
#p-cal{--pc:#d39a1c}
#p-money{--pc:#e07a3a}
.panel{scroll-margin-top:16px;background:linear-gradient(180deg,color-mix(in srgb,var(--pc,#fff) 9%,#fff) 0,#fff 120px)}
.ph h2{color:color-mix(in srgb,var(--pc,var(--ink)) 70%,#1c1630)}
.sq{width:34px;height:34px;border-radius:12px;background:linear-gradient(150deg,color-mix(in srgb,var(--pc) 65%,#fff),var(--pc));display:grid;place-items:center;flex:none;box-shadow:0 6px 14px -6px var(--pc)}
.sq svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- רשימת היום ---------- */
.agenda{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.agroup{display:flex;flex-direction:column;gap:8px;min-width:0}
.agroup h3{margin:0;font-size:.82rem;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;padding-inline:4px}
.agroup h3 i{width:7px;height:7px;border-radius:50%;background:var(--u)}
.ai{display:flex;align-items:center;gap:10px;padding:10px 12px 10px 10px;border:1px solid var(--line);border-radius:16px;background:#fff;cursor:pointer;box-shadow:0 2px 6px -3px rgba(70,50,140,.12)}
.ai::before{content:"";width:5px;align-self:stretch;border-radius:5px;background:var(--pc);flex:none;margin-block:2px}
.ai .tt{flex:1;min-width:0}
.ai .tx{background:linear-gradient(currentColor,currentColor) no-repeat right 58%/0 1.5px;transition:background-size .45s var(--soft);overflow-wrap:anywhere}
.ai small{display:block;color:var(--muted);font-size:.77rem;overflow-wrap:anywhere}
.ai .chip{font-size:.72rem;font-weight:600;border-radius:99px;padding:2px 9px;color:color-mix(in srgb,var(--pc) 80%,#000);background:color-mix(in srgb,var(--pc) 13%,#fff);flex:none;white-space:nowrap}
.ai .arr{width:18px;height:18px;flex:none;stroke:var(--muted);fill:none;stroke-width:2;transition:transform .45s var(--spring),stroke .2s}
@media (hover:hover){.ai:hover .arr{transform:translateX(-4px);stroke:var(--pc)}}
.ai.done{background:#faf9fd}
.ai.done .tt{color:var(--muted)}
.ai.done .tx{background-size:100% 1.5px}
.ai.done .chip{opacity:.5}
.ai.done .chk{background:var(--wa);border-color:var(--wa)}
.ai.done .chk svg{stroke-dashoffset:0}
.ai.sel{box-shadow:0 0 0 2px var(--pc);background:color-mix(in srgb,var(--pc) 5%,#fff)}
.allset{grid-column:1/-1;text-align:center;color:var(--wa-deep);font-weight:600;padding:10px}
.fchips{display:flex;gap:8px;flex-wrap:wrap}
.fchip{display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:.82rem;font-weight:500;cursor:pointer;transition:transform .3s var(--spring),background .2s,border-color .2s}
.fchip i{width:8px;height:8px;border-radius:50%;background:var(--c)}
.fchip b{font-variant-numeric:tabular-nums}
.fchip:active{transform:scale(.94)}
.fchip[aria-pressed="true"]{border-color:var(--c);background:color-mix(in srgb,var(--c) 9%,#fff)}

/* ---------- שורות (פניות, לקוחות, שיחות, כסף) ---------- */
.ltabs{display:flex;gap:6px;flex-wrap:wrap}
.ltab{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line2);background:#fff;border-radius:99px;padding:7px 14px;font-size:.9rem;font-weight:500;cursor:pointer;transition:background .2s,border-color .2s,transform .15s var(--spring)}
.ltab i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.ltab b{color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.ltab[aria-selected=true]{background:color-mix(in srgb,var(--c) 13%,#fff);border-color:var(--c)}
.ltab[aria-selected=true] b{color:var(--ink)}
.ltab:active{transform:scale(.96)}
.ltab .hint{font-size:.74rem;color:var(--muted);font-weight:400}
.bar{display:flex;gap:4px;height:8px}
.bar i{border-radius:99px;background:var(--c);transition:flex-grow .7s var(--spring);min-width:8px}
.lrows{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:18px;background:#fff;overflow:hidden}
.lr{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto 14px;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid #f1edf8;cursor:pointer;outline:none;transition:background .15s}
.lr:first-child{border-top:0}
.lr:hover,.lr:focus-visible{background:color-mix(in srgb,var(--c) 6%,#fff)}
.lr.sel{background:color-mix(in srgb,var(--c) 12%,#fff)}
.lr .d{width:9px;height:9px;border-radius:50%;background:var(--c);opacity:.35}
.lr .d.w{opacity:1}
.src{width:24px;height:24px;border-radius:8px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--sc) 14%,#fff)}
.src svg{width:14px;height:14px;stroke:var(--sc);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lr .tt{min-width:0;display:flex;flex-direction:column;gap:1px}

.lr.dim{opacity:.55}

.lrows .empty{border:0;border-radius:0}
.older{color:var(--muted);font-size:.85rem}
.rwa{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:#e6f4ec;color:#2a9a63;flex:none}.rwa svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.rwa:hover{background:#d3eddf}
#wzProb{resize:none;overflow:hidden;min-height:70px}
.linkb{border:0;background:none;padding:0;font:inherit;color:var(--lav-deep);font-weight:500;cursor:pointer;text-decoration:underline}
.cool{background:#eef3fa;border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:8px}
.cool .ct{font-size:.9rem;font-weight:600;color:#4a6f9e}
.crow{background:#fff;border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.crow .tt,.ar .tt{display:flex;flex-direction:column;min-width:0}
.crow .nm,.ar .nm{font-weight:600}
.crow .sm,.ar .sm{color:var(--muted);font-size:.84rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crow .cb{display:flex;gap:8px}.crow .cb .btn{flex:1}
@media (min-width:901px){.crow{flex-direction:row;align-items:center}.crow .tt{flex:1}.crow .cb .btn{flex:none}}
.asearch{width:100%;box-sizing:border-box;border:1px solid var(--line2);border-radius:14px;padding:11px 14px;font:inherit;font-size:16px;background:#fff;color:var(--ink)}
@media (min-width:901px){.asearch{max-width:420px}}
.ar{display:grid;grid-template-columns:auto minmax(0,1fr) auto auto;align-items:center;gap:10px;padding:10px 14px;border-top:1px solid #f1edf8}
.ar .btn{min-height:34px;padding:4px 12px}
.why{font-size:.75rem;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
.w-closed{background:#e6f4ec;color:#2a9a63}.w-cold{background:#eef3fa;color:#4a6f9e}.w-nope{background:#f3f1f7;color:var(--muted)}
.older a{color:var(--lav-deep);font-weight:500}
@media (min-width:901px){.lrows.two{display:grid;grid-template-columns:1fr 1fr}.lrows.two .lr{border-top:0;border-bottom:1px solid #f1edf8}.lrows.two .lr:nth-child(odd){border-inline-end:1px solid #f1edf8}.lrows.two .lmore,.lrows.two .empty{grid-column:1/-1}}
.daysep{font-size:.78rem;font-weight:600;color:var(--muted);padding:9px 14px 3px;background:#fcfbfe;border-top:1px solid #f1edf8}

/* ---------- חלונית פרטים ---------- */
.scrim{position:fixed;inset:0;z-index:30;background:rgba(43,37,64,.22);opacity:0;pointer-events:none;transition:opacity .3s}
.scrim.on{opacity:1;pointer-events:auto}

.sheet{position:fixed;z-index:31;background:#fff;display:flex;flex-direction:column;gap:12px;overflow-y:auto;overscroll-behavior:contain;
  top:0;bottom:0;left:0;width:min(440px,92vw);padding:22px 22px calc(22px + env(safe-area-inset-bottom,0px));border-right:1px solid var(--line);box-sizing:border-box;
  box-shadow:12px 0 40px -12px rgba(70,50,140,.22);transform:translateX(-104%);transition:transform .45s var(--spring)}

.sheet h2{font-size:1.3rem;margin:0;text-wrap:balance;font-weight:600}
.sheet .meta{margin:0;font-size:.9rem}
.sheet p.body{margin:0;color:var(--ink)}
.sheet dl{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;margin:0;font-size:.9rem}
.sheet dt{color:var(--muted)}
.sheet dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sheet ul{margin:0;padding-inline-start:18px;display:flex;flex-direction:column;gap:3px}
.sheet .sacts{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.cedit{display:flex;flex-direction:column;gap:8px}.cedit label{display:flex;flex-direction:column;gap:3px;font-size:.82rem;color:var(--muted)}.cedit input,.cedit textarea{border:1px solid var(--line2);border-radius:12px;padding:8px 12px;background:#fff;color:var(--ink);font-size:.95rem}
.sheet .sacts .btn{min-height:46px}
.sheet .sacts .main{background:var(--pc);border-color:var(--pc);color:#fff}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap}
.sheet .row .btn{flex:1}
.sheet .snav{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;border-top:1px solid var(--line)}
.sheet .snav button{font-size:.85rem;color:var(--muted);background:none;border:0;cursor:pointer;padding:6px}
.sheet .snav button:disabled{opacity:.35;cursor:default}
.sheet .x{position:absolute;top:14px;left:14px;width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;line-height:1;color:var(--muted)}
.note-weak{font-size:.8rem;color:var(--late);background:var(--accent-soft);border-radius:10px;padding:6px 10px}

/* ---------- אשף ---------- */
.steps{display:flex;gap:6px;align-items:center}
.steps i{flex:1;height:5px;border-radius:9px;background:var(--line);transition:background .4s}
.steps i.on{background:var(--pc)}
.steps i.cur{background:linear-gradient(90deg,var(--pc),color-mix(in srgb,var(--pc) 40%,#fff))}
.wz{display:flex;flex-direction:column;gap:10px}
.wz label{display:flex;flex-direction:column;gap:4px;font-size:.84rem;color:var(--muted)}
.wz input,.wz select,.wz textarea{width:100%;box-sizing:border-box;font-size:16px;border:1px solid var(--line2);border-radius:12px;padding:9px 12px;background:#fcfbfe;color:var(--ink);min-width:0}
.wz textarea{min-height:64px;resize:vertical}
.wz .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.wz .opt{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line2);border-radius:14px;padding:10px 12px;cursor:pointer;background:#fff;color:var(--ink);font-size:.92rem}
.wz .opt input{accent-color:var(--pc);width:18px;height:18px;flex:none;margin:0}
.wz .opt:has(input:checked){border-color:var(--pc);background:color-mix(in srgb,var(--pc) 7%,#fff)}
.wz .done-badge{display:flex;align-items:center;gap:8px;color:var(--wa-deep);font-weight:500;background:#e9f6ef;border-radius:12px;padding:8px 12px;font-size:.9rem}
.wz .hint2{font-size:.8rem;color:var(--muted);margin:0}

/* ---------- סידור בוקר ---------- */
.mw{position:fixed;inset:0;z-index:35;display:grid;place-items:center;padding:16px;background:rgba(43,37,64,.28);opacity:0;pointer-events:none;transition:opacity .3s}
.mw.on{opacity:1;pointer-events:auto}
.mw .card{width:min(560px,100%);max-height:calc(100dvh - 32px);overflow-y:auto;background:#fff;border-radius:28px;padding:24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 30px 60px -20px rgba(70,50,140,.45);
  transform:translateY(20px) scale(.97);transition:transform .5s var(--spring);box-sizing:border-box;--pc:var(--lav)}
.mw.on .card{transform:none}
.mw h2{margin:0;font-size:1.35rem;font-weight:600}
.mw .lead{margin:0;color:#5b5378}
.mw .lines{display:flex;flex-direction:column;gap:8px}
.mw .line{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--tray)}
.mw .line b{font-variant-numeric:tabular-nums;min-width:26px;text-align:center;font-size:1.1rem;color:var(--c)}
.mw .acts{display:flex;gap:8px;flex-wrap:wrap}
.mw .acts .btn{flex:1}

/* ---------- מסכים צרים ---------- */
@media (max-width:1180px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{grid-template-columns:minmax(0,1fr) 230px}}
@media (max-width:1000px){.span7,.span5,.span6{grid-column:span 12}.agenda{grid-template-columns:1fr}}
@media (max-width:900px){
  .shell{grid-template-columns:minmax(0,1fr);padding-block:14px calc(110px + env(safe-area-inset-bottom,0px))}

  .wrap{gap:14px}
  .hero{grid-template-columns:minmax(0,1fr) 110px;padding:20px 18px;border-radius:24px}
  .hero h1{font-size:1.4rem}
  .hero p{font-size:.95rem;margin-bottom:12px}
  .art{height:110px}
  .ping{display:none}
  .tiles{gap:12px}
  .tile{padding:13px 14px 12px;border-radius:20px}
  .tile .ti{width:36px;height:36px;border-radius:12px}
  .tile .sp{display:none}
  .tile .v{font-size:1.45rem}
  .panel{padding:16px 14px 18px;border-radius:22px}
  .task{flex-wrap:wrap}
  .dock{display:flex;position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));
    background:rgba(255,255,255,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:24px;padding:6px;gap:2px;
    box-shadow:0 14px 34px -12px rgba(70,50,140,.4),0 0 0 1px var(--line);width:min(calc(100% - 32px),480px);box-sizing:border-box}
  .dock button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;cursor:pointer;padding:7px 2px;border-radius:18px;font-size:.7rem;color:var(--muted);position:relative;transition:background .3s,color .3s;min-width:0}
  .dock button svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
  .dock button[aria-current=true]{background:var(--lav-soft);color:var(--lav-deep);font-weight:500}
  .dock button i{position:absolute;top:3px;left:calc(50% - 20px);font-style:normal;font-size:.62rem;font-weight:600;min-width:17px;height:17px;border-radius:99px;display:grid;place-items:center;background:var(--accent);color:#fff;padding:0 4px}
  .toast{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
  .ltabs{display:grid;grid-template-columns:repeat(var(--nt,4),minmax(0,1fr));gap:5px}
  .ltab{flex-direction:column;gap:2px;padding:7px 2px;border-radius:12px;font-size:.74rem;line-height:1.15;text-align:center}
  .ltab b{order:-1;font-size:1.05rem;color:var(--ink)}
  .ltab i,.ltab .hint{display:none}
  .ltab[aria-selected=true]{box-shadow:inset 0 -3px 0 var(--c)}
  .sheet{top:auto;left:0;right:0;width:auto;max-height:88%;border-right:0;border-radius:24px 24px 0 0;padding-top:8px;transform:translateY(105%);box-shadow:0 -10px 30px rgba(70,50,140,.16)}
  .sheet .grab{display:block;width:40px;height:5px;border-radius:9px;background:var(--line2);margin:4px auto 4px;flex:none}
  .sheet .x{display:none}
  .mw{place-items:end center;padding:0}
  .mw .card{border-radius:26px 26px 0 0;max-height:92dvh;padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
}
@media (max-width:420px){.hero{grid-template-columns:minmax(0,1fr) 84px;gap:8px;padding:18px 16px}.art{height:84px;align-self:start}.cta{padding:11px 16px;font-size:.92rem}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.phs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.phs .ph0,.phs .ph1{display:block;width:100%;aspect-ratio:1;border-radius:12px;background:var(--tray);object-fit:cover}

@media (max-width:900px){
  body.tabbed .grid>.panel{display:none}
  body.tabbed .grid>.panel.cur{display:flex}

  .cta.soft{display:none}

}
.gate{max-width:440px;margin:12vh auto 0;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center;grid-column:1/-1}

<body>
<!-- לוח העסק (07.11.2026): מקום אחד לכל העסק — פניות (וואטסאפ + שיחות טלפון), לקוחות בתהליך, שיחות, משימות, יומן, כסף.
     אותה התחברות כמו האפליקציה (ob2_auth). קורא וכותב לאותן טבלאות של האפליקציה, באותה צורה. -->
<div class="shell boot" id="app">
  <aside class="side" aria-label="תפריט">
    <a href="./" aria-label="לאפליקציה" style="align-self:center"><img class="logo" src="logo.png" alt="אור בגג"></a>

    <nav class="nav" id="nav"></nav>
    <div class="foot"><button class="btn" type="button" data-morning>סידור הבוקר</button><a class="btn" href="home.html" data-owner hidden>לוח הבית</a><a class="btn" href="./">לאפליקציה</a><span class="status" id="status"></span></div>
  </aside>

  <div class="wrap">
    <div class="mtop"><a href="./" aria-label="לאפליקציה"><img class="logo" src="logo.png" alt="אור בגג"></a><span class="who" id="meName2"></span><a class="btn" href="home.html" data-owner hidden style="min-height:34px;padding:4px 12px">הבית</a></div>

    <div class="gate" id="gate" hidden><h2>צריך להתחבר</h2><p>הלוח משתמש באותה התחברות של האפליקציה. מתחברים שם פעם אחת, וחוזרים לכאן.</p><a class="btn go" href="./">להתחברות באפליקציה</a></div>

    <section class="hero" id="hero" style="--i:0" hidden>
      <div>
        <span class="date" id="date"></span>
        <h1 id="greet">שלום</h1>
        <p id="brief">טוען…</p>
        <div class="ctas"><button class="cta" type="button" id="cta"><svg viewBox="0 0 24 24"><path d="M19 12H5M12 5l-7 7 7 7"/></svg><span>להתחיל מהדחוף</span></button>
          <button class="cta soft" type="button" data-morning>סידור הבוקר</button></div>
      </div>
      <div class="art" aria-hidden="true">
        <div class="ping" id="ping" hidden><i><svg viewBox="0 0 32 32"><path d="M16 3a13 13 0 0 0-11.2 19.6L3 29l6.6-1.7A13 13 0 1 0 16 3z"/></svg></i><span id="pingT"></span></div>
        <svg viewBox="0 0 300 190">
          <defs>
            <linearGradient id="gW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fffaf3"/><stop offset="1" stop-color="#f3e6d6"/></linearGradient>
            <linearGradient id="gR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f0a070"/><stop offset="1" stop-color="#d9693a"/></linearGradient>
            <linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#f5ad3c"/></linearGradient>
            <linearGradient id="gP" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2b48a"/><stop offset="1" stop-color="#c48d5e"/></linearGradient>
            <linearGradient id="gL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8fd3a4"/><stop offset="1" stop-color="#3fa56a"/></linearGradient>
          </defs>
          <ellipse cx="150" cy="176" rx="130" ry="10" fill="#7b68d9" opacity=".12"/>
          <g class="bob2"><circle cx="232" cy="46" r="22" fill="url(#gS)"/><circle cx="232" cy="46" r="31" fill="#ffd27a" opacity=".22"/></g>
          <g class="bob"><path d="M58 52a14 14 0 0 1 27-4 11 11 0 1 1 3 22H58a9 9 0 0 1 0-18z" fill="#fff" opacity=".95"/></g>
          <rect x="92" y="96" width="122" height="78" rx="6" fill="url(#gW)"/>
          <path d="M78 102 153 46l75 56" fill="none" stroke="url(#gR)" stroke-width="16" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M153 60 104 96h98z" fill="#f6ead9"/>
          <rect x="182" y="58" width="14" height="26" rx="3" fill="#c98a5c"/>
          <rect x="140" y="124" width="28" height="50" rx="8" fill="#9b86e8"/>
          <circle cx="161" cy="150" r="2.4" fill="#fff"/>
          <rect x="106" y="118" width="24" height="22" rx="5" fill="#d9e9fb"/><path d="M118 118v22M106 129h24" stroke="#fff" stroke-width="2.5"/>
          <rect x="178" y="118" width="24" height="22" rx="5" fill="#d9e9fb"/><path d="M190 118v22M178 129h24" stroke="#fff" stroke-width="2.5"/>
          <g stroke="#b58a62" stroke-width="4" stroke-linecap="round"><path d="M226 174 246 92M246 174 262 104"/><path d="M230 158l18 3M234 140l18 4M238 122l18 4M242 106l17 3" stroke-width="3"/></g>
          <g class="bob2"><path d="M40 150h30l-4 24H44z" fill="url(#gP)"/><path d="M55 150c-3-18-16-24-20-34 14 2 21 14 20 34zM55 150c2-20 12-30 22-34-1 14-10 26-22 34zM55 150c0-14-2-26 0-38 6 12 4 26 0 38z" fill="url(#gL)"/></g>
        </svg>
      </div>
    </section>

    <div class="tiles" id="tiles"></div>

    <div class="grid" id="grid" hidden>
      <section class="panel span12" id="p-today" style="--i:1">
        <div class="ph"><span class="sq"><svg viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg></span><h2>הרשימה של היום</h2><span class="sum" id="todaySum">כל מה שמחכה, מכל החלונות, לפי דחיפות.</span></div>
        <div class="fchips" id="fchips" role="group" aria-label="סינון לפי תחום"></div>
        <div class="agenda" id="agenda"></div>
      </section>

      <section class="panel span12" id="p-inbox" style="--i:2">
        <div class="ph"><span class="sq"><svg viewBox="0 0 24 24"><path d="M4 13l2.5-7h11L20 13v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg></span><h2>פניות</h2><span class="sum" id="inboxSum"></span></div>
        <div id="inboxCool"></div>
        <div class="ltabs" id="itabs" role="tablist" aria-label="פניות"></div>
        <div class="lrows two" id="inbox"></div>
        <div class="older" id="inboxOlder"></div>
      </section>

      <section class="panel span12" id="p-cust" style="--i:3">
        <div class="ph"><span class="sq"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7"/><path d="M5 10v10h14V10"/><path d="M10 20v-5h4v5"/></svg></span><h2>לקוחות</h2><span class="sum" id="custSum"></span></div>
        <div id="custCool"></div>
        <div class="bar" id="cbar" aria-hidden="true"></div>
        <div class="ltabs" id="ctabs" role="tablist" aria-label="שלבים"></div>
        <div class="lrows two" id="cust"></div>
        <div class="older" id="custOlder"></div>
      </section>

      <section class="panel span12" id="p-calls" style="--i:4">
        <div class="ph"><span class="sq"><svg viewBox="0 0 24 24"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg></span><h2>שיחות טלפון</h2><span class="sum" id="callsSum"></span></div>
        <div class="ltabs" id="ktabs" role="tablist" aria-label="סוג שיחה"></div>
        <div class="lrows" id="calls"></div>
      </section>

      <section class="panel span7" id="p-tasks" style="--i:5">
        <div class="ph"><span class="sq"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.5l2.3 2.2 4.7-5"/></svg></span><h2>משימות</h2><span class="sum" id="taskSum"></span>
          <div class="seg tool" id="taskDay"><span class="pill"></span><button type="button" data-d="today" aria-pressed="true">היום</button><button type="button" data-d="tom" aria-pressed="false">מחר</button></div></div>
        <div class="tasks" id="tasks"></div>
        <form class="add" id="addTask"><input id="taskIn" placeholder="משימה חדשה..." autocomplete="off" aria-label="משימה חדשה"><button class="btn" type="submit">להוסיף</button></form>
      </section>

      <section class="panel span5" id="p-cal" style="--i:6">
        <div class="ph"><span class="sq"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M4 10h16M9 3v4M15 3v4"/></svg></span><h2>יומן</h2>
          <div class="seg tool" id="calDay"><span class="pill"></span><button type="button" data-d="today" aria-pressed="true">היום</button><button type="button" data-d="tom" aria-pressed="false">מחר</button><button type="button" data-d="week" aria-pressed="false">השבוע</button></div></div>
        <div class="cal" id="cal"></div>
      </section>

      <section class="panel span12" id="p-money" style="--i:7">
        <div class="ph"><span class="sq"><svg viewBox="0 0 24 24"><path d="M7 3h7l4 4v14H7z"/><path d="M10 12h5M10 16h5"/></svg></span><h2>גבייה וחשבוניות</h2><span class="sum" id="moneySum"></span></div>
        <div class="ltabs" id="mtabs" role="tablist" aria-label="כסף"></div>
        <div class="lrows two" id="money"></div>
      </section>

      <section class="panel span12" id="p-arch" style="--i:8">
        <div class="ph"><span class="sq"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="5" rx="1.5"/><path d="M5 9v10h14V9M10 13h4"/></svg></span><h2>ארכיון</h2><span class="sum" id="archSum"></span></div>
        <input class="asearch" id="archQ" type="search" placeholder="חיפוש לפי שם, טלפון או עיר" autocomplete="off" aria-label="חיפוש בארכיון">
        <div class="ltabs" id="atabs" role="tablist" aria-label="סיבה"></div>
        <div class="lrows" id="arch"></div>
      </section>
    </div>
  </div>
</div>
<nav class="dock" id="dock" aria-label="ניווט"></nav>

<div class="scrim" id="scrim"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="shT" hidden></aside>
<div class="mw" id="mw" role="dialog" aria-modal="true" aria-labelledby="mwT" hidden><div class="card" id="mwc"></div></div>
<div class="toast" id="toast" role="status"><span id="tmsg"></span><button id="undo" type="button">ביטול</button></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="board.js"></script>
</body>
</html>
