<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#b4552b">
<title>אור בגג</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="print.css">
</head>
<body>
<div id="app">
  <div id="login" class="screen" hidden>
    <div class="login-box">
      <div class="brand">אור בגג</div>
      <div class="dim">התחברות — אותו אימייל וסיסמה כמו באפליקציה הישנה</div>
      <input id="li-email" type="email" inputmode="email" dir="ltr" placeholder="אימייל" autocomplete="username">
      <input id="li-pass" type="password" dir="ltr" placeholder="סיסמה" autocomplete="current-password">
      <button class="btn pri" id="li-go">התחבר</button>
      <div id="li-msg" class="dim"></div>
    </div>
  </div>

  <header id="top" hidden>
    <div class="search-wrap">
      <input id="search" type="search" placeholder="חיפוש לקוח, טלפון, כתובת" autocomplete="off">
    </div>
    <div id="netdot" title="מצב חיבור"></div>
  </header>

  <main id="views" hidden>
    <section id="v-customers" class="view">
      <div class="list" id="cust-list"></div>
    </section>
    <section id="v-customer" class="view" hidden></section>
    <section id="v-job" class="view" hidden></section>
    <section id="v-money" class="view" hidden></section>
    <section id="v-more" class="view" hidden></section>
    <section id="v-trash" class="view" hidden></section>
    <section id="v-quote" class="view" hidden></section>
    <section id="v-print" class="view" hidden></section>
    <section id="v-settings" class="view" hidden></section>
    <section id="v-catalog" class="view" hidden></section>
  </main>

  <nav id="tabs" hidden>
    <button data-tab="customers" class="on"><span class="ico">👥</span>לקוחות</button>
    <button data-tab="work"><span class="ico">🏠</span>עבודות</button>
    <button id="plus" aria-label="חדש">+</button>
    <button data-tab="money"><span class="ico">₪</span>כסף</button>
    <button data-tab="more"><span class="ico">⋯</span>עוד</button>
  </nav>
  <template id="t-customer-form"><div class="sheet"><div class="sheet-h"><b id="f-title">לקוח חדש</b><button class="btn sm ghost" data-close>סגור</button></div>
<label>שם<input id="f-name" required autocomplete="off"></label><label>טלפון<input id="f-phone" inputmode="tel" dir="ltr" autocomplete="off"></label><label>כתובת<input id="f-address" autocomplete="off"></label><label>הערות<textarea id="f-notes" rows="2"></textarea></label>
<button class="btn pri" id="f-save">שמור</button></div></template>
<template id="t-plus"><div class="sheet"><div class="sheet-h"><b>מה להוסיף?</b><button class="btn sm ghost" data-close>סגור</button></div><button class="btn" data-new="customer">לקוח חדש</button><button class="btn" data-new="job">עבודה ללקוח קיים</button></div></template>
<template id="t-job-form"><div class="sheet"><div class="sheet-h"><b>עבודה חדשה</b><button class="btn sm ghost" data-close>סגור</button></div>
<label>שם העבודה (למשל: נזילה ברוכבים)<input id="j-title" autocomplete="off"></label><label>מה הלקוח תיאר<textarea id="j-problem" rows="2"></textarea></label><label>מועד ביקור (אם נקבע)<input id="j-visit" type="datetime-local"></label>
<button class="btn pri" id="j-save">שמור</button></div></template>
<template id="t-item-form"><div class="sheet"><div class="sheet-h"><b>סעיף</b><button class="btn sm ghost" data-close>סגור</button></div>
<label>שם הסעיף<input id="i-title" autocomplete="off"></label><label>תיאור (יופיע בהצעה)<textarea id="i-desc" rows="3"></textarea></label>
<div class="row2"><label style="flex:1">כמות<input id="i-qty" type="number" inputmode="decimal" dir="ltr"></label><label style="flex:1">יחידה<input id="i-unit" placeholder="מטר / יח'"></label></div>
<div class="row2"><label style="flex:1">מחיר ליחידה (לפני מע"מ)<input id="i-ppu" type="number" inputmode="decimal" dir="ltr"></label><label style="flex:1">דחיפות<select id="i-urg"><option value="">—</option><option value="גבוהה">גבוהה</option><option value="בינונית">בינונית</option><option value="נמוכה">נמוכה</option></select></label></div>
<div class="total"><span>סה"כ לסעיף</span><span id="i-total">0 ₪</span></div><button class="btn pri" id="i-save">שמור סעיף</button></div></template>
<template id="t-catalog"><div class="sheet"><div class="sheet-h"><b>מהקטלוג</b><button class="btn sm ghost" data-close>סגור</button></div><input id="cat-search" placeholder="חיפוש בקטלוג" autocomplete="off"><div class="list" id="cat-list"></div></div></template>
<template id="t-discount"><div class="sheet"><div class="sheet-h"><b>הנחה</b><button class="btn sm ghost" data-close>סגור</button></div><div class="row2"><label style="flex:1">סוג<select id="d-type"><option value="amount">סכום בש"ח</option><option value="percent">אחוזים</option></select></label><label style="flex:1">ערך (0 = בלי הנחה)<input id="d-value" type="number" inputmode="decimal" dir="ltr"></label></div><button class="btn pri" id="d-save">שמור</button></div></template>
<template id="t-payment-form"><div class="sheet"><div class="sheet-h"><b>רישום תשלום</b><button class="btn sm ghost" data-close>סגור</button></div>
<div class="row2"><label style="flex:1">סכום (כולל מע"מ)<input id="p-amount" type="number" inputmode="decimal" dir="ltr"></label><label style="flex:1">תאריך<input id="p-date" type="date"></label></div>
<div class="row2"><label style="flex:1">אמצעי<select id="p-method"><option value="העברה">העברה בנקאית</option><option value="ביט">ביט</option><option value="צ'ק">צ'ק</option><option value="אשראי">אשראי</option><option value="מזומן">מזומן</option></select></label></div>
<label>הערה<input id="p-note" autocomplete="off"></label><label class="chk"><input id="p-inv" type="checkbox"> הוצאתי כבר חשבונית בחשבונית ירוקה</label>
<button class="btn pri" id="p-save">שמור תשלום</button></div></template>
<template id="t-catalog-item"><div class="sheet"><div class="sheet-h"><b>פריט בקטלוג</b><button class="btn sm ghost" data-close>סגור</button></div>
<label>שם<input id="c-name" autocomplete="off"></label><div class="row2"><label style="flex:1">קטגוריה<input id="c-cat"></label><label style="flex:1">יחידה<input id="c-unit" placeholder="מטר / יח'"></label></div><label>מחיר ליחידה (לפני מע"מ)<input id="c-price" type="number" inputmode="decimal" dir="ltr"></label><label>תיאור להצעה<textarea id="c-desc" rows="3"></textarea></label>
<div class="row2"><button class="btn pri" id="c-save">שמור</button><button class="btn ghost" id="c-hide">הסתר</button></div></div></template>
<template id="t-confirm"><div class="sheet"><b id="confirm-title"></b><div class="dim" id="confirm-msg"></div><div class="row2"><button class="btn" data-close>בטל</button><button class="btn danger" id="confirm-yes">כן</button></div></div></template>
<template id="t-pick-customer"><div class="sheet"><div class="sheet-h"><b>לאיזה לקוח?</b><button class="btn sm ghost" data-close>סגור</button></div><input id="pick-search" placeholder="חיפוש" autocomplete="off"><div class="list" id="pick-list"></div></div></template>
<input id="photo-in" type="file" accept="image/*" multiple capture="environment" hidden>
<div id="lightbox" hidden><img alt=""><button class="btn sm" data-close-lb>סגור</button></div>
<div id="toast" hidden></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js"></script>
<script src="data.js"></script>
<script src="quote.js"></script>
<script>boot();</script>
</body>
</html>
